# httpd.cfg — RPCortex web server configuration
# Edit this, then run:  httpd start

# Listen port (override per-run with: httpd start <port>)
port: 8080

# Heading shown on the built-in dashboard (blank = the device name)
title:

# serve_dir: a folder to host as a STATIC WEBSITE — its index.html is served
#   at '/', and other files (css/js/images) load from it too. Put your site in
#   e.g. /Users/root/www and set:  serve_dir: /Users/root/www
#   Leave BLANK to show the built-in status dashboard instead.
serve_dir:

# browse: 'true' exposes the filesystem browser at /fs and downloads at /dl.
#   Set 'false' to serve ONLY your site / the dashboard (recommended if the
#   device is reachable beyond your trusted LAN).
browse: true
